[project]
name = "callanalyzer-backend"
version = "0.2.0"
description = "CALL-ANALYZER backend — framework CRUD, ingestion, evaluation pipeline, chat"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # asyncpg + raw SQL rather than an ORM: the scoring engine lives in Postgres
    # functions, and an ORM would only get in the way of calling them.
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",   # file uploads
    "pyjwt>=2.9",                 # Supabase JWT verification
    "httpx>=0.27",
    # Declarative pipeline graph. Chosen over bare asyncio so the pipeline's
    # STRUCTURE is data that can be rendered as a diagram, not control flow.
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
